    <!-- Avoid a bright white flash before React mounts after sunset. -->
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('qt_limousine_appearance_v1');
          var hour = new Date().getHours();
          var dark = preference === 'dark' || (preference !== 'light' && (hour >= 18 || hour < 6));
          document.documentElement.dataset.qtPrepaint = dark ? 'night' : 'day';
        } catch (error) { /* Storage may be disabled. */ }
      })();
    </script>
    <style>html[data-qt-prepaint="night"],html[data-qt-prepaint="night"] body{background:#0c1720}</style>

    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
        });
      }

      // Gracefully catch and swallow benign WebSocket or HMR-related connection errors
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason) {
          var reasonStr = String(event.reason);
          var reasonMsg = event.reason.message ? String(event.reason.message) : '';
          if (
            reasonStr.indexOf('WebSocket') !== -1 ||
            reasonMsg.indexOf('WebSocket') !== -1 ||
            reasonStr.indexOf('vite') !== -1 ||
            reasonMsg.indexOf('vite') !== -1 ||
            reasonStr.indexOf('Nhanh chóng') !== -1 ||
            reasonMsg.indexOf('Nhanh chóng') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
          }
        }
      }, true);

      window.addEventListener('error', function(event) {
        if (event.message) {
          var msg = String(event.message);
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('Nhanh chóng') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
          }
        }
      }, true);
    </script>

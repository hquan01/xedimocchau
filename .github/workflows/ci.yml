name: Mộc Châu Travel — Validate PR
on:
  pull_request:
  push:
    branches:
      - 'mocchau-v6-*'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
